[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]   # errors, pyflakes, imports, upgrades
ignore = ["E501"]                  # ignore line length if you prefer

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "F403"]
"serve.py" = ["E402"]
"ingest.py" = ["E402"]